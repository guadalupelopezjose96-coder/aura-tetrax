# AÑADIR AL INICIO DE SUS CÓDIGOS PARA ENLAZAR AMBOS DOMINIOS AL 100%
from flask_cors import CORS

def aplicar_blindaje_host(app):
    # Solo permite que estos dos dominios intercambien datos de ingeniería
    CORS(app, origins=[
        "https://fourphonix.com",
        "https://auraintelcore.com",
        "https://www.fourphonix.com",
        "https://www.auraintelcore.com"
    ])
    
    @app.after_request
    def add_header(response):
        # Sello de Soberanía en cada paquete de datos
        response.headers['X-Frame-Options'] = 'SAMEORIGIN'
        response.headers['X-Content-Type-Options'] = 'nosniff'
        response.headers['X-Engineering-By'] = 'Arquitecto-Jose-Lopez'
        response.headers['Server'] = 'Aura-Intel-Core-Bunker'
        return response
