tunnel: <TU_TUNNEL_ID>
credentials-file: /data/data/com.termux/files/home/.cloudflared/<TU_TUNNEL_ID>.json
protocol: quic
originRequest:
  connectTimeout: 30s
  noTLSVerify: true
ingress:
