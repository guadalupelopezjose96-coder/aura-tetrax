[package]
name = "law_core_engine"
version = "0.1.0"
edition = "2021"
authors = ["José Emanuel Guadalupe López (JEGL) <guadalupelopezjose96-coder>"]
description = "Motor de ejecución determinista Law-as-Code y Verdad Digital"

[[bin]]
name = "law_core_engine"
path = "src/main.rs"

[dependencies]
crossbeam = "0.8"
rayon = "1.10"
atomic = "0.6"
num_cpus = "1.16"  # <- Dependencia añadida para solucionar el error de alcance
rust_decimal = { version = "1.34", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

