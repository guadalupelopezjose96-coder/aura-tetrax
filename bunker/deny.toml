[graph]
targets = ["aarch64-linux-android", "x86_64-unknown-linux-gnu"]

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0" # <--- Soluciona el rechazo de 'colored'
]

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

[bans]
multiple-versions = "warn"
highlight = "all"
