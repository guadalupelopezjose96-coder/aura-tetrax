name: Rust CI & Auditoria Legal/Seguridad

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  calidad-y-seguridad:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Rust estable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de dependencias Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verificar formato (rustfmt)
        run: cargo fmt --all -- --check

      - name: Análisis estático estricto (Clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Ejecutar pruebas
        run: cargo test --verbose

      - name: Auditoría de vulnerabilidades en dependencias
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
