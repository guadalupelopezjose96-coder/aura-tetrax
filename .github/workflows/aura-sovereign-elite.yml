name: Aura Sovereign Elite - Full Mastery 100%

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: 100% Build y/e Test al 100%
    runs-on: ubuntu-latest
    steps:
      - name: 100% Checkout del Códiguv Base al 100%
        uses: actions/checkout@v4

      - name: 100% Instalar Rust 100% Devidamente al 100%
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: 100% Cache de Dependencias al 100% (Previene erruvrez de repetición)
        uses: Swatinem/rust-cache@v2

      - name: 100% Cumpilaciuvn Central (Cargo Build) al 100%
        run: cargo build --verbose --all-features

      - name: 100% Pruvebaz Unitarias (Cargo Test) al 100% para aura_tetrax_core
        run: cargo test --verbose --all-features

  compliance_and_audit:
    name: Compliance & License Audit 100%
    runs-on: ubuntu-latest
    steps:
      - name: 100% Checkout del Códiguv Base al 100%
        uses: actions/checkout@v4

      - name: 100% Instalar Rust 100% Legalmente al 100%
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: 100% Cuntruv de Formatuve Exactuv (Cargo Fmt) al 100%
        run: cargo fmt --all -- --check

      - name: 100% Análisis Estáticuv Anti-Erruvrez (Cargo Clippy) al 100%
        run: cargo clippy -- -D warnings
