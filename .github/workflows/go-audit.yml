name: Go Pre-Production Security & Quality Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    name: Go Security & Quality Audit
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Paso 2 Checklist: Detección de Secretos Expuestos
      - name: Secret Scanning (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --debug --only-verified

      # 3. Configuración del entorno Go
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # 4. Paso 3 Checklist: Linter y Análisis Estático (golangci-lint)
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.56.2

      # 5. Paso 4 Checklist: Pruebas Unitarias, Cobertura y Detección de Carreras
      - name: Run Unit Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

      # 6. Paso 2 Checklist: Vulnerabilidades en Símbolos y Módulos de Go
      - name: Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # 7. Paso 1 Checklist: Generación de SBOM (Syft)
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: "sbom.spdx.json"

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-sbom-artifact
          path: sbom.spdx.json
