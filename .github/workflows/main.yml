name: "Aura-Tetrax Sovereign Compliance & SHA-256 Seal"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legal-and-crypto-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Statutory Trade Secret Files (Fla. Stat. 812.081 & FOIA Ex. 4)
        run: |
          test -f LICENSE
          test -f README.md
          test -f ACUERDO_INTERCAMBIO.md
          test -f ACUERDO_INTERCAMBIO.md.asc

      - name: Generate Official SHA-256 Cryptographic Manifest
        run: |
          sha256sum LICENSE README.md ACUERDO_INTERCAMBIO.md ACUERDO_INTERCAMBIO.md.asc > GITHUB_SHA256_SEAL.txt
          cat GITHUB_SHA256_SEAL.txt
