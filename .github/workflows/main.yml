on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compilar y verificar
        run: cargo check --all-targets
