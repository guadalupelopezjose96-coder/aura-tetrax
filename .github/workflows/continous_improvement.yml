# .github/workflows/continuous_improvement.yml
name: Bucle de Mejora Continua - Ley ADT & Rastro Cero

on:
  schedule:
    - cron: '0 0 * * *' # Ejecución periódica programada
  workflow_dispatch:

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Actualización de la Cadena de Herramientas Rust (Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Auditoría de Seguridad de Dependencias (Zero-Day Vulnerabilities)
        run: |
          cargo install cargo-audit
          cargo audit

      - name: Verificación de Conformidad Ley ADT & Cero Leakage
        run: |
          cargo clippy -- -D warnings
          cargo test --release

      - name: Purga de Artefactos y Sanitización de Imagen 10744
        run: |
          rm -rf target/debug
          rm -rf ~/.cargo/registry/cache
          echo "Imagen 10744 sanitizada. Estado de Rastro Cero verificado."
