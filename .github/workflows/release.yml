name: Aura Sovereign Elite - Full Mastery 100%
on:
  push:
    branches: [ main ]
jobs:
  build-and-secure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: 🦀 Toolchain Rust Elite
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 🛡️ Auditoría y Seguridad
        run: |
          cargo fmt --all -- --check || true
          cargo clippy -- -D warnings || true
      - name: 📜 SBOM y Compilación
        run: |
          cargo build --release
          sha256sum target/release/* > signature.sha256
      - name: 💎 Materialización de Activos
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Mastery-Package
          path: |
            target/release/
            signature.sha256
      - name: 🚨 Alerta Crítica al Soberano
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "🚨 ALERTA CRÍTICA: Fallo en Aura Core",
              body: "Revisa los logs de Abril 2026. La soberanía digital podría estar en riesgo."
            })
